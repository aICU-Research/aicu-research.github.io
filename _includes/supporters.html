<div class="team-grid" id="supporters-grid">
  {% for supporter in site.data.supporters %}
  <div class="card-small contain" data-order="{{ supporter.order | default: 9999 }}">
    {% if supporter.url %}
    <a href="{{ supporter.url }}" target="_blank" rel="noopener noreferrer">
    {% endif %}
      <div class="img-box">
        <img src="{{ supporter.image | relative_url }}" alt="{{ supporter.name }}">
      </div>
      <div class="card-content">
        <h3>{{ supporter.name }}</h3>
      </div>
    {% if supporter.url %}
    </a>
    {% endif %}
  </div>
  {% endfor %}
</div>
