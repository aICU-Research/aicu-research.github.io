<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <title>{{ page.title }}</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', Arial, sans-serif;
      min-height: 100vh;
      background: white;
      padding-top: 76px;

      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      background: linear-gradient(90deg, #4F0433 0%, #415DDA 100%);
      height: 76px;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-decoration: none;
    }

    .header-logo {
      height: 152px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* MAIN */
    main {
      max-width: 1250px;
      margin: 2em auto;
      padding: 1em;
      width: 100%;
      flex: 1;
    }

    h1, h2 {
      text-align: center;
    }

    /* FOOTER */
    footer {
      background: linear-gradient(90deg, #4F0433 0%, #415DDA 100%);
      padding: 1em;
      margin-top: auto;
    }

    .footer-logos {
      display: grid;
      grid-template-columns: repeat(auto-fit, 120px);
      justify-content: center;
      gap: 0.6em;
    }

    .footer-logos a {
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 0.3em;
      border-radius: 6px;
      min-height: 40px;
      text-decoration: none;
    }

    .footer-logos img {
      height: 28px;
      width: 80px;
      object-fit: contain;
      margin: 0 auto;
    }

    /* NEWS GRID (bigger) */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 320px));
      gap: 1em;
      margin-top: 1.2em;
      justify-content: center;
    }

    /* TEAM GRID */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, 160px);
      gap: 0.8em;
      margin-top: 1.2em;
      justify-content: center;
    }

    /* NEWS CARD */
    .card {
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      font-size: 0.9em;
      width: 320px;
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 0.6em;
    }

    .card h3 {
      margin-bottom: 0.3em;
      font-size: 1em;
      line-height: 1.2;
    }

    .meta {
      font-size: 0.8em;
      color: #555;
    }

    /* TEAM CARD */
    .card-small {
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
      width: 160px;
      aspect-ratio: 0.7 / 1;
      display: flex;
      flex-direction: column;
      font-size: 0.8em;
    }

    .card-small img {
      width: 100%;
      height: 70%;
      object-fit: cover;
    }

    .card-small .card-content {
      height: 30%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0.4em;
    }

    .card a,
    .card-small a {
      text-decoration: none;
      color: black;
      display: block;
    }

    .card a:hover h3,
    .card-small a:hover h3 {
      text-decoration: underline;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      body {
        padding-top: 60px;
      }

      header {
        height: 60px;
      }

      .header-logo {
        height: 120px;
      }

      .news-grid {
        grid-template-columns: 320px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="/" class="header-logo-link">
      <img class="header-logo" src="/favicon.png" alt="aICU">
    </a>
  </header>

  <main>
    {{ content }}
  </main>

  <footer>
    <div class="footer-logos">
      <a href="https://ki.se/en/research/research-areas-centres-and-networks/research-groups/research-groups-in-anesthesiology-and-intensive-care" target="_blank">
        <img src="images/banner/karolinska.jpg">
      </a>

      <a href="https://www.cst.cam.ac.uk/" target="_blank">
        <img src="images/banner/cambridge.png">
      </a>

      <a href="https://mlatcl.github.io/" target="_blank">
        <img src="images/banner/mlatcl.png">
      </a>

      <a href="https://science.ai.cam.ac.uk/" target="_blank">
        <img src="images/banner/accelerate.jpg">
      </a>
    </div>
  </footer>

</body>
</html>
