intro:
  title: About Us
  text: |-
    Intensive care units treat the sickest patients in the hospital. Clinicians must make complex, high-stakes decisions under time pressure, while much of the information generated in intensive care remains underused.

    The aICU project was initiated at Karolinska Institutet to address these challenges. Today, we bring together clinicians, machine learning researchers and engineers across collaborating universities to develop a standardised pipeline for AI in critical care. Our work spans clinical problem formulation, data infrastructure, model development, safety assessment, clinical integration and evaluation in real-world settings.

    Our aim is to strengthen critical care by supporting clinicians and building evidence for when and how AI can help improve patient outcomes.
